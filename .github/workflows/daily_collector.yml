name: Daily Collector

on:
  schedule:
    - cron: '0 1 * * *' # 매일 새벽 1시 (UTC 기준, 한국 시간 오전 10시)
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 60분 초과 시 강제 종료 (무한 루프 방지)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Git LFS 파일(DB) 다운로드 활성화

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🚀 [최적화 1] pip 패키지 캐싱 (매번 라이브러리 다운로드 방지)
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🚀 [최적화 2] Playwright 브라우저 캐싱 (매번 300MB 다운로드 방지)
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 🚀 [최적화 3] --with-deps 제거 (지옥의 apt-get 폰트 다운로드 스킵)
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run daily collection script
        run: python run_daily.py

      - name: Optimize SQLite Database
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('beauty_catalog.db')
          conn.execute('PRAGMA wal_checkpoint(TRUNCATE);')
          conn.execute('VACUUM;')
          conn.close()
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily trend data" && git push)

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL 시크릿이 설정되지 않아 배포 트리거를 건너뜁니다."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
